[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tissueqc"
version = "0.1.0.dev0"
description = "Quantitative quality control for multiplex fluorescence tissue images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Suyog Pathare" }]
keywords = ["spatial biology", "multiplex immunofluorescence", "quality control", "microscopy", "xenium"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.1.0",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
tissueqc = "tissueqc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tissueqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
